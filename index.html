<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Guide for BADMINTON Girlies</title>

<style>
/* --- BASE STYLES --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    scroll-behavior: smooth;
}

body {
    background: linear-gradient(180deg, #FFFFFF 0%, #f790db 100%);
    color: #2f2e2e;
}

/* --- NAVBAR --- */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    z-index: 1000;
}

.logo {
    font-weight: bold;
    color: #FF69B4;
    letter-spacing: 3px;
    font-size: 1.2rem;
}

.nav-links a {
    margin-left: 20px;
    text-decoration: none;
    color: #D63384;
    font-weight: 600;
    transition: color 0.3s;
}

.nav-links a:hover {
    color: #FF69B4;
}

/* --- SECTIONS --- */
.section {
    min-height: 100vh;
    padding: 100px 40px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#home h1 {
    font-size: 48px;
    color: #D63384;
    line-height: 1.2;
}

.subtitle {
    margin-top: 15px;
    color: #3f0932;
    font-size: 1.1rem;
}

/* --- BUTTONS --- */
.main-btn, .auth-btn {
    margin-top: 20px;
    padding: 14px 32px;
    border: none;
    border-radius: 50px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
    text-decoration: none;
    display: inline-block;
}

.main-btn { background: #FFB6C1; }
.auth-btn { background: #D63384; }

.main-btn:hover, .auth-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.05);
}

.auth-buttons {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    justify-content: center;
}

/* --- MODAL STYLING --- */
.modal {
    display: none; /* Hidden by default */
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 40px;
    border-radius: 24px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    position: relative;
    text-align: center;
    animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popUp {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    cursor: pointer;
    font-size: 22px;
    color: #aaa;
    transition: color 0.2s;
}

.close-btn:hover { color: #D63384; }

.modal h2 {
    margin-bottom: 20px;
    color: #D63384;
}

.modal input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid #eee;
    background: #fdfdfd;
    outline: none;
}

.modal input:focus {
    border-color: #FFB6C1;
    background: #fff;
}

.modal-submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 50px;
    background: #D63384;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    transition: background 0.3s;
}

.modal-submit:hover { background: #FF69B4; }

.switch-link {
    margin-top: 20px;
    font-size: 14px;
    color: #D63384;
    cursor: pointer;
    text-decoration: underline;
}

/* --- FOOTER --- */
footer {
    padding: 30px;
    text-align: center;
    color: #da04b3;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">F.D.B</div>
    <div class="nav-links">
        <a href="coverpage.html">Home</a>
        <a href="about.html">About</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</div>

<section id="home" class="section">
    <h1>Style Guide for <br><b>BADMINTON Girlies</b></h1>
    <p class="subtitle">Serve in style, play with grace.</p>

    <a href="toc.html" class="main-btn">Start Exploring 💖</a>

    <div class="auth-buttons">
        <button class="auth-btn" onclick="toggleModal('loginModal', 'open')">Login ✨</button>
        <button class="auth-btn" onclick="toggleModal('signupModal', 'open')">Sign Up ✨</button>
    </div>
</section>

<div class="modal" id="loginModal">
    <div class="modal-content">
        <span class="close-btn" onclick="toggleModal('loginModal', 'close')">✕</span>
        <h2>Login 💖</h2>
        <form onsubmit="handleLogin(event)">
            <input type="text" id="loginUser" placeholder="Username" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit" class="modal-submit">Login</button>
        </form>
        <div class="switch-link" onclick="switchModal('loginModal', 'signupModal')">Don't have an account? Sign Up</div>
    </div>
</div>

<div class="modal" id="signupModal">
    <div class="modal-content">
        <span class="close-btn" onclick="toggleModal('signupModal', 'close')">✕</span>
        <h2>Create Account ✨</h2>
        <form onsubmit="handleSignup(event)">
            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPass" placeholder="Password" required>
            <input type="password" id="signupConfirm" placeholder="Confirm Password" required>
            <button type="submit" class="modal-submit">Sign Up</button>
        </form>
        <div class="switch-link" onclick="switchModal('signupModal', 'loginModal')">Already have an account? Login</div>
    </div>
</div>

<footer>
    F.D.B 2026
</footer>

<script>
/**
 * Generic function to open or close modals
 * @param {string} modalId - The ID of the modal element
 * @param {string} action - 'open' or 'close'
 */
function toggleModal(modalId, action) {
    const modal = document.getElementById(modalId);
    modal.style.display = (action === 'open') ? "flex" : "none";
}

/**
 * Switch from one modal directly to another
 */
function switchModal(currentId, nextId) {
    toggleModal(currentId, 'close');
    toggleModal(nextId, 'open');
}

// LOGIN HANDLER
function handleLogin(event) {
    event.preventDefault();
    const user = document.getElementById("loginUser").value;
    alert("Welcome back, " + user + " 💕");
    toggleModal('loginModal', 'close');
}

// SIGNUP HANDLER
function handleSignup(event) {
    event.preventDefault();
    const name = document.getElementById("signupName").value;
    const pass = document.getElementById("signupPass").value;
    const confirm = document.getElementById("signupConfirm").value;

    if (pass !== confirm) {
        alert("Passwords do not match ❌");
        return;
    }

    alert("Account created for " + name + " 🎉");
    toggleModal('signupModal', 'close');
}

// CLOSE ON BACKGROUND CLICK
window.onclick = function(e) {
    if (e.target.className === 'modal') {
        e.target.style.display = "none";
    }
}

// CLOSE ON ESCAPE KEY
window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }
});

// LOGOUT FUNCTION
function logout() {

    // Optional confirmation
    const confirmLogout = confirm("Are you sure you want to logout? 💖");

    if (confirmLogout) {

        // Close any open modal
        document.querySelectorAll('.modal').forEach(m => {
            m.style.display = 'none';
        });

        // Success message
        alert("Logged out successfully ✨");

        // Redirect back to cover page
        window.location.href = "coverpage.html";
    }
}
</script>

</body>
</html>
