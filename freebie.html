<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tumbler Catalog — April 2026</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Poppins', sans-serif;
  background: #facaf3;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 30px 16px;
}

/* CLICKABLE TEXT */
.stripe span {
  cursor: pointer;
  transition: 0.2s;
}

.stripe span:hover {
  transform: scale(1.08);
  text-decoration: underline;
}

/* POPUP */
.popup-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.popup {
  background: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
  max-width: 350px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.3);
}

.popup button {
  margin-top: 15px;
  padding: 8px 16px;
  border: none;
  background: #1e3d34;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

.popup button:hover {
  background: #4fc3f7;
  color: #000;
}

/* CATALOG GRID */
.catalog {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 6px;
  width: 760px;
  background: #ccc;
  border-radius: 20px;
  overflow: hidden;
}

.quad {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  padding: 18px 14px;
  min-height: 340px;
}

/* COLORS */
.q1 { background: linear-gradient(145deg, #f4857a, #f9b8a8, #f5c5be); }
.q2 { background: linear-gradient(145deg, #b8e8f0, #c8f0f8, #d8f5fc); }
.q3 { background: linear-gradient(145deg, #a8e0b0, #c0eecc, #d8f8e0); }
.q4 { background: linear-gradient(145deg, #e8b0e8, #f0c8f0, #f8daf8); }

/* ROW */
.prod-row {
  display: flex;
  align-items: center;
  position: relative;
  height: 88px;
}

/* STRIPES */
.stripe {
  position: absolute;
  left: 0;
  right: 0;
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  z-index: 1;
}

.stripe.label-left {
  justify-content: flex-start;
  padding-left: 16px;
}

.stripe.label-right {
  justify-content: flex-end;
  padding-right: 16px;
}

.stripe span {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #fff;
}

.stripe.dark-text span { color: #333; }

/* IMAGE */
.img-box {
  width: 100px;
  height: 86px;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
}

.prod-row.img-left .img-box { margin-right: auto; }
.prod-row.img-right .img-box { margin-left: auto; }

.img-box img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(3px 6px 10px rgba(0,0,0,0.22));
  transform: rotate(-12deg);
}
</style>
</head>
