<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racket Catalog — April 2026</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Poppins', sans-serif;
  /* Aesthetic Gradient Background */
  background: linear-gradient(135deg, #f1bbcd 0%, #dbc7e4 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

/* BACK BUTTON */
.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  background: #bc6bb6;
  color: white;
  padding: 10px 20px;
  font-size: 13px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: 600;
  transition: 0.3s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  z-index: 999;
}

.back-btn:hover {
  background: #f08adc;
  color: #000;
  transform: translateX(-5px);
}

/* SEMI-FULL SCREEN CONTAINER */
.catalog-container {
  width: 100%;
  max-width: 1000px; /* Semi-full screen width */
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-radius: 24px;
  padding: 40px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  position: relative;
  overflow: hidden;
}

/* Decorative background circle */
.catalog-container::before {
  content: '';
  position: absolute;
  top: -100px;
  right: -100px;
  width: 300px;
  height: 300px;
  background: rgba(246, 134, 214, 0.986);
  border-radius: 50%;
  z-index: 0;
}

h1 {
    font-size: 24px;
    margin-bottom: 30px;
    color: #1e3d34;
    text-align: center;
    position: relative;
    z-index: 1;
}

/* GRID LAYOUT FOR ITEMS */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 25px;
  position: relative;
  z-index: 1;
}

.row {
  background: white;
  border-radius: 16px;
  display: flex;
  align-items: center;
  padding: 20px;
  transition: 0.3s;
  border: 1px solid #f0f0f0;
}

.row:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  border-color: #f252cd;
}

.img-box {
  width: 140px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
  border-radius: 12px;
}

.img-box img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  filter: drop-shadow(2px 5px 8px rgba(0,0,0,0.1));
}

.prod-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-left: 20px;
}

.prod-name {
  font-size: 14px;
  font-weight: 800;
  color: #1a1a1a;
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* SPECS TEXT */
.specs {
  font-size: 11px;
  color: #666;
  margin-bottom: 10px;
  line-height: 1.4;
}

.specs span {
  display: inline-block;
  background: #eee;
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 4px;
  font-weight: 600;
}

.price-pill {
  font-size: 16px;
  font-weight: 800;
  color: #1e3d34;
  margin-bottom: 12px;
}

/* ADD TO CART BUTTON */
.add-btn {
  width: fit-content;
  padding: 10px 20px;
  font-size: 12px;
  font-weight: 700;
  border: none;
  border-radius: 30px;
  background: #f252cd;
  color: white;
  cursor: pointer;
  transition: 0.3s;
  text-transform: uppercase;
}

.add-btn:hover {
  background: #ef92ff;
  box-shadow: 0 5px 15px rgba(242, 82, 205, 0.4);
}

.section-footer {
  margin-top: 30px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 2px;
  color: #760f5b;
}
</style>
</head>

<body>

<a href="toc.html" class="back-btn">← Back to Menu</a>

<div class="catalog-container">
    <h1>🏸 PREMIUM RACKET SELECTION</h1>

    <div class="grid">
        <div class="row">
          <div class="img-box"><img src="c:\Users\bagob\Downloads\Victor Carlton.png"></div>
          <div class="prod-info">
            <div class="prod-name">Victor Carlton S200</div>
            <div class="specs"><span>4U</span> <span>G5</span> Carbon Fiber | Head Heavy</div>
            <div class="price-pill">₱999</div>
            <button class="add-btn" onclick="addToCart('Victor Carlton S200', 999)">Add to Cart</button>
          </div>
        </div>

        <div class="row">
          <div class="img-box"><img src="c:\Users\bagob\Downloads\Arcsaber.jpg"></div>
          <div class="prod-info">
            <div class="prod-name">Arcsaber ARC_11</div>
            <div class="specs"><span>3U</span> <span>G4</span> Even Balance | Control</div>
            <div class="price-pill">₱899</div>
            <button class="add-btn" onclick="addToCart('Arcsaber ARC_11', 899)">Add to Cart</button>
          </div>
        </div>

        <div class="row">
          <div class="img-box"><img src="c:\Users\bagob\Downloads\Nano Ray blue.png"></div>
          <div class="prod-info">
            <div class="prod-name">Yonex Nano Ray</div>
            <div class="specs"><span>4U</span> <span>G5</span> Head Light | Speed Series</div>
            <div class="price-pill">₱1,199</div>
            <button class="add-btn" onclick="addToCart('Yonex Nano Ray', 1199)">Add to Cart</button>
          </div>
        </div>

        <div class="row">
          <div class="img-box"><img src="c:\Users\bagob\Downloads\7.png"></div>
          <div class="prod-info">
            <div class="prod-name">Victor Auraspeed</div>
            <div class="specs"><span>5U</span> <span>G6</span> Super Light | Ultra Fast</div>
            <div class="price-pill">₱1,299</div>
            <button class="add-btn" onclick="addToCart('Victor Auraspeed', 1299)">Add to Cart</button>
          </div>
        </div>
    </div>

    <div class="section-footer">EST. 2026 // POWERED BY F.D.B SHOP</div>
</div>

<script>
function addToCart(name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let existing = cart.find(item => item.name === name);

  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ name: name, price: price, qty: 1 });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  
  // Fancy Alert Replacement (Optional)
  alert("✨ " + name + " has been added to your cart!");
}
</script>

</body>
</html>
